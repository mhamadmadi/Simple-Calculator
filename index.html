<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator__container">
        <div class="calculator">
            <h2>Simple Calculator</h2>
            <input type="text" id="number1" placeholder="Enter first number">
            <input type="text" id="number2" placeholder="Enter second number">
        <div class="buttons">
            <button class="add" id="add">+</button>
            <button class="subtract" id="subtract">-</button>
            <button class="multiply" id="multiply">×</button>
            <button class="divide" id="divide">÷</button>
        </div>
        <p class="output" id="output"></p>
        <p class="footer">Project by Mohammad Madi</p>
    </div>
    </div>
</body>
</html>
